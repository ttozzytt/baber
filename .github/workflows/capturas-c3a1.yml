name: Capturas de evidencia C3-A1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capturas-c3a1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capturar las dos PWA publicadas
        run: |
          mkdir -p evidencias
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const targets = [
            { id:'barberia', url:'https://ttozzytt.github.io/baber/proyecto-personal/fase-ui-pwa/pwa.html' },
            { id:'veterinaria', url:'https://ttozzytt.github.io/Eventix/proyecto-grupal/fase-ui-pwa/pwa.html' }
          ];
          const viewports = [
            { id:'360x800', width:360, height:800, mobile:true },
            { id:'390x844', width:390, height:844, mobile:true },
            { id:'768x1024', width:768, height:1024, mobile:false },
            { id:'landscape-844x390', width:844, height:390, mobile:true }
          ];
          const browser = await chromium.launch({headless:true});
          const summary = [];
          for (const target of targets) {
            for (const vp of viewports) {
              const context = await browser.newContext({
                viewport:{width:vp.width,height:vp.height},
                deviceScaleFactor:1, isMobile:vp.mobile, hasTouch:vp.mobile
              });
              const page = await context.newPage();
              const errors=[];
              page.on('pageerror', error=>errors.push(String(error)));
              await page.goto(target.url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForTimeout(3500);
              await page.screenshot({path:`evidencias/${target.id}-${vp.id}-inicio-pwa.png`,fullPage:false});
              const layout = await page.evaluate(() => ({
                viewportWidth:innerWidth, documentWidth:document.documentElement.scrollWidth,
                horizontalOverflow:document.documentElement.scrollWidth>innerWidth,
                navHeight:document.querySelector('header')?.getBoundingClientRect().height ?? null,
                images:[...document.images].map(i=>({src:i.currentSrc||i.src,loaded:i.complete&&i.naturalWidth>0})),
                navigation:(()=>{const n=performance.getEntriesByType('navigation')[0];return n?{domContentLoadedMs:Math.round(n.domContentLoadedEventEnd),loadMs:Math.round(n.loadEventEnd),transferBytes:n.transferSize}:null})(),
                resourceStats:(()=>{const a=performance.getEntriesByType('resource');return {count:a.length,transferBytes:a.reduce((s,x)=>s+(x.transferSize||0),0),resources:a.map(x=>({name:x.name.split('/').pop().slice(0,90),durationMs:Math.round(x.duration),transferBytes:x.transferSize||0,type:x.initiatorType}))}})()
              }));
              summary.push({project:target.id,viewport:vp.id,...layout,pageErrors:errors});
              const serviceLink=page.locator('a[href="#servicios"]:visible').first();
              if(await serviceLink.count()) {
                try { await serviceLink.click({timeout:5000}); await page.waitForTimeout(900); await page.screenshot({path:`evidencias/${target.id}-${vp.id}-servicios.png`,fullPage:false}); } catch {}
              }
              if(target.id==='barberia') {
                const bookingLink=page.locator('a[href="#reservar"]:visible').first();
                if(await bookingLink.count()) {
                  try { await bookingLink.click({timeout:5000}); await page.waitForTimeout(800); const field=page.locator('#ownerName, #ownerNameInput, input[type="text"]').first(); if(await field.count()) await field.focus(); await page.screenshot({path:`evidencias/barberia-${vp.id}-formulario-enfoque.png`,fullPage:false}); } catch {}
                }
              }
              await context.close();
            }
          }
          await fs.writeFile('evidencias/mediciones.json',JSON.stringify(summary,null,2));
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: evidencias-responsividad-c3a1
          path: evidencias/
          if-no-files-found: error
          retention-days: 7
