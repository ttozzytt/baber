name: Restaurar paquete limpio C3-A1
on:
  push:
    branches: [main]
    paths:
      - ".c3a1-upload/**"
      - ".github/workflows/restore-c3a1.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restaurar estructura
        run: |
          set -e
          cat .c3a1-upload/part*.b64 | base64 -d > /tmp/barber.tar.xz
          tar -xJf /tmp/barber.tar.xz -C .
          rm -rf .c3a1-upload
          rm -f .github/workflows/restore-c3a1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sincronizar paquete C3-A1 de Barbería"
          git push origin HEAD:main
